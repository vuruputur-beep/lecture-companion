[project]
name = "lecture-companion"
version = "0.1.0"
description = "Turn lecture transcripts and recordings into detailed study notes and interview prep."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "openai>=1.40",
    "python-docx>=1.1",
    "pymupdf>=1.24,<2",
    "markdown-it-py>=3.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
